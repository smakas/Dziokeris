<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Džiokeris</title>
<style>
:root{
  --page:#f7f3ec; --ink:#2b2620; --muted:#8a8072;
  --oak:#b07a45; --oak-dk:#8a5a30; --oak-lt:#c99a68;
  --felt:#2f6b46; --felt-dk:#265a3a;
  --danger:#b3402f; --gold:#d9a441;
  --paper:#fbf7ec; --rule:#d8cdb4; --pencil:#3a352c;
  --red:#c22; --blk:#111; --club:#1a3a8f; --jkr:#800080;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--page);color:var(--ink);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;max-width:1340px;margin:0 auto;padding:8px;gap:7px;}

/* ── Header — warm oak band ── */
#header{display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--oak-lt),var(--oak) 55%,var(--oak-dk));
  border-radius:12px;padding:7px 14px;color:#fff8ef;flex-shrink:0;
  box-shadow:0 2px 0 rgba(0,0,0,.1) inset,0 4px 12px rgba(138,90,48,.25);}
#header h1{font-size:1.2rem;letter-spacing:1px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.25);}
/* running scoreboard — lives at the top of the right column */
#score-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px;flex-shrink:0;}
.se{flex:1 1 44px;text-align:center;background:#f3ece0;border:1px solid #e0d6c2;border-radius:8px;padding:3px 4px;}
.se .sn{font-size:0.58rem;font-weight:700;color:#8a7c66;white-space:nowrap;}
.se .sv{font-size:1.02rem;font-weight:800;color:var(--pencil);font-family:'Segoe Print','Comic Sans MS',cursive;line-height:1.15;}
.se.danger{background:#fbeae6;border-color:#e6b8ae;}
.se.danger .sv{color:var(--danger);}
.se.active-p{background:#e4f0e8;border-color:var(--felt);outline:1.5px solid var(--felt);}
.se.active-p .sn{color:var(--felt);}
#header-right{margin-left:auto;display:flex;gap:6px;align-items:center;}
#candy-lbl{font-size:0.82rem;font-weight:800;white-space:nowrap;}
#wins-lbl{font-size:0.74rem;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;white-space:nowrap;font-weight:700;}
.hbtn{font-size:0.7rem;padding:3px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);cursor:pointer;color:#fff8ef;font-weight:600;}
.hbtn:hover{background:rgba(255,255,255,.28);}
#skip-btn{display:none;font-size:0.7rem;padding:3px 9px;background:#fff3d6;border:1px solid #f0c040;border-radius:6px;cursor:pointer;color:#a60;font-weight:700;}
#skip-btn.show{display:inline-block;}
.ver-lbl{font-size:0.56rem;color:rgba(255,248,239,.6);white-space:nowrap;align-self:center;cursor:default;}
@media (max-width:860px){.ver-lbl{display:none;}}

/* ── Main split ── */
#main{display:flex;flex:1;gap:7px;min-height:0;}
#center-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
#right-col{width:232px;flex-shrink:0;display:flex;flex-direction:column;}

/* ── The felt table (round — seats around the edge) ── */
#felt{position:relative;flex:1;min-height:0;
  display:grid;
  grid-template-columns:minmax(112px,150px) 1fr minmax(112px,150px);
  grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  background:radial-gradient(115% 95% at 50% 50%, var(--felt) 0%, var(--felt-dk) 84%);
  border:9px solid var(--oak-dk);border-radius:22px;padding:11px;overflow:hidden;
  box-shadow:0 8px 26px rgba(38,90,58,.32),0 2px 0 rgba(255,255,255,.06) inset;}
#felt::before{content:"";position:absolute;left:50%;top:50%;width:min(40vh,300px);height:min(40vh,300px);
  transform:translate(-50%,-50%) rotate(45deg);border:2px solid rgba(255,255,255,.09);border-radius:16px;
  pointer-events:none;z-index:0;}
#felt>*{position:relative;z-index:1;}

/* seat placement: left / top / right / me(bottom) */
#opp0p{grid-column:1;grid-row:2;align-self:center;}
#opp1p{grid-column:2;grid-row:1;justify-self:center;width:100%;max-width:440px;}
#opp2p{grid-column:3;grid-row:2;align-self:center;}
#center-area{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:6px;min-height:0;}
#hand-wrap{grid-column:1 / -1;grid-row:3;}

.opp-panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:6px 8px;color:#eef7f0;transition:border-color .3s,box-shadow .3s;}
.opp-panel.side .opp-hand{max-height:118px;overflow:hidden;}
.opp-hdr{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.opp-name{font-weight:700;font-size:0.82rem;}
.opp-name::before{content:"";display:inline-block;width:20px;height:20px;border-radius:50%;
  background:var(--gold);margin-right:5px;vertical-align:-5px;}
.opp-ct{font-size:0.66rem;color:rgba(255,255,255,.7);margin-left:auto;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:9px;font-weight:700;}
.opp-hand{display:flex;flex-wrap:wrap;gap:2px;min-height:37px;justify-content:center;}
.opp-combos{display:none;}
.opp-status{font-size:0.64rem;color:#ffe08a;font-style:italic;min-height:13px;margin-top:2px;transition:opacity .3s;}
.ai-bar-wrap{height:3px;background:rgba(255,255,255,.18);border-radius:2px;margin-top:2px;overflow:hidden;display:none;}
.ai-bar{height:100%;background:var(--gold);border-radius:2px;width:0%;}

/* piles — up in the top-left, out of the melds' way */
#piles-row{grid-column:1;grid-row:1;align-self:start;display:flex;gap:10px;align-items:flex-end;justify-content:center;}
.pile-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.pile-label{font-size:0.64rem;color:#e7f3ea;font-weight:700;letter-spacing:.5px;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.pile-count{font-size:0.62rem;color:#c8e2d1;}
.pile-wrap.live:hover .card{border-color:#ffe08a;box-shadow:0 0 0 2px rgba(255,224,138,.5);}
.pile-wrap.active-pile .card{border-color:#ffe08a !important;box-shadow:0 0 0 3px rgba(255,224,138,.6) !important;}
#disc-pile-wrap{position:relative;width:51px;height:73px;flex-shrink:0;}
#discard-notif{display:none;font-size:0.74rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);border:1px solid #f0c040;padding:4px 9px;border-radius:7px;align-self:center;animation:popIn .25s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes blinkPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,165,0,0);border-color:#ccc;}50%{box-shadow:0 0 0 5px rgba(240,165,0,.85);border-color:#f0a500;}}
.card.blink{animation:blinkPulse .35s ease-in-out 2;}
#round-lbl{position:absolute;top:9px;right:13px;font-size:0.62rem;color:#cfe6d6;text-align:right;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.4);z-index:2;}
#discard-notif{align-self:center;}

/* action messages — live in the Žurnalas panel, each fades over 30s */
#toasts{display:flex;flex-direction:column;gap:5px;align-items:stretch;
  flex:1;min-height:0;overflow-y:auto;}
.toast{background:rgba(18,38,26,.86);color:#eaf5ee;font-size:0.74rem;font-weight:600;
  padding:5px 12px;border-radius:14px;box-shadow:0 3px 8px rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.14);max-width:100%;white-space:normal;
  word-break:break-word;flex-shrink:0;animation:toastLife 30s ease forwards;}
.toast.t-me{background:rgba(24,58,40,.9);border-color:rgba(160,220,180,.35);}
.toast .tp{font-weight:800;margin-right:5px;color:#ffe6b8;}
.toast.t-me .tp{color:#bff0cf;}
@keyframes toastLife{
  0%{opacity:0;transform:translateY(8px) scale(.96);}
  3%{opacity:1;transform:none;}
  55%{opacity:1;}
  100%{opacity:0;}
}

/* turn banner */
#turn-banner{text-align:center;font-size:0.82rem;font-weight:700;padding:4px 12px;border-radius:8px;flex-shrink:0;transition:all .3s;}
#turn-banner.my-turn{background:rgba(255,255,255,.92);color:#1a4;border:2px solid #fff;animation:pulseG 1.6s ease-in-out infinite;}
#turn-banner.ai-turn{background:rgba(0,0,0,.28);color:#ffe08a;border:1px solid rgba(255,224,138,.5);}
#turn-banner.round-over{background:rgba(0,0,0,.22);color:#dfeee5;border:1px solid rgba(255,255,255,.2);}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}60%{box-shadow:0 0 0 5px rgba(255,255,255,.35);}}

/* table (Stalas) */
#table-wrap{flex:1;min-height:0;background:rgba(255,255,255,.09);border-radius:12px;border:1px solid rgba(255,255,255,.16);padding:8px;overflow-y:auto;}
#table-hdr{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
#table-lbl{font-size:0.62rem;font-weight:700;color:#dcefe2;text-transform:uppercase;letter-spacing:1px;}
#combos-row{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;justify-content:center;}
.combo-grp{display:flex;gap:2px;padding:6px 7px;background:#fffdf8;border-radius:8px;border:1px solid #d8d2c6;position:relative;cursor:pointer;transition:border-color .15s;}
.combo-grp:hover{border-color:var(--oak);}
.combo-grp.drag-tgt{border-color:var(--felt) !important;background:#f0fff4 !important;box-shadow:0 0 0 2px rgba(47,107,70,.4) !important;}
@keyframes glowInvalid{from{box-shadow:0 0 4px 2px rgba(195,51,0,.3);}to{box-shadow:0 0 16px 6px rgba(195,51,0,.7);}}
.combo-grp.invalid-grp{border-color:var(--danger) !important;background:#fff5f5 !important;animation:glowInvalid .75s ease-in-out infinite alternate;}
@keyframes glowValid{from{box-shadow:0 0 4px 2px rgba(47,107,70,.3);}to{box-shadow:0 0 14px 6px rgba(47,107,70,.6);}}
.combo-grp.valid-grp{border-color:var(--felt) !important;background:#f0fff4 !important;animation:glowValid .9s ease-in-out infinite alternate;}
.combo-grp .card.tdragging{opacity:.25;}
.combo-grp.target{border-color:var(--felt) !important;box-shadow:0 0 0 2px rgba(47,107,70,.4);}
.combo-grp .owner-tag{position:absolute;top:-8px;left:6px;font-size:0.54rem;background:var(--felt-dk);color:#e7f3ea;padding:0 5px;border-radius:5px;white-space:nowrap;}
.combo-grp .card.stageable{cursor:pointer;}
.combo-grp .card.stageable:hover{border-color:#f60 !important;transform:translateY(-5px) !important;box-shadow:0 4px 12px rgba(255,102,0,.25) !important;}
#new-combo-zone{min-width:52px;min-height:63px;border:2px dashed rgba(255,255,255,.4);border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-size:1.1rem;cursor:pointer;transition:all .15s;padding:4px;}
#new-combo-zone.drag-tgt{border-color:#fff;color:#fff;background:rgba(255,255,255,.15);}

/* your hand */
#hand-wrap{background:#fffdf8;border-radius:12px;border:2px solid var(--felt);padding:8px 10px;flex-shrink:0;box-shadow:0 3px 10px rgba(138,90,48,.12);}
#hand-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap;}
#hand-hdr .btn{padding:7px 12px;font-size:0.8rem;}
#phase-lbl{font-size:0.73rem;color:var(--muted);font-style:italic;flex:1;min-width:80px;text-align:right;}
#hand-lbl{font-size:0.64rem;font-weight:800;color:var(--felt);text-transform:uppercase;letter-spacing:1px;}
#hand-lbl::before{content:"";display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--felt);margin-right:5px;vertical-align:-4px;}
.pts-badge{font-size:0.72rem;background:var(--felt);color:#fff;padding:2px 9px;border-radius:11px;font-weight:700;}
.pts-badge.hot{background:var(--danger);}
#hand-cards{display:flex;flex-wrap:wrap;gap:3px;min-height:74px;align-items:flex-end;}
.card.dragging{opacity:.3;transform:scale(.92);}
.card.drag-over{border-left:3px solid #f60 !important;}

/* action buttons (now inline in the hand header) */
.btn{padding:8px 14px;border-radius:9px;border:none;cursor:pointer;font-size:0.82rem;font-weight:700;transition:all .12s;white-space:nowrap;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.12);}
.btn:disabled{opacity:.32;cursor:not-allowed;box-shadow:none;}
.bg{background:var(--felt);} .bg:hover:not(:disabled){background:#25583a;}
.bb{background:#3f6ea8;} .bb:hover:not(:disabled){background:#345d90;}
.bo{background:#e60;color:#fff;} .bo:hover:not(:disabled){background:#c50;}
.br{background:var(--danger);} .br:hover:not(:disabled){background:#943426;}
.bw{background:#efe7d7;color:#6a5a44;} .bw:hover:not(:disabled){background:#e4d9c3;}

/* ── Cards ── */
.card{width:52px;height:74px;border-radius:7px;border:1.5px solid #d8d2c6;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;user-select:none;position:relative;transition:transform .1s,box-shadow .1s,border-color .15s;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.card.clickable{cursor:pointer;}
.card.clickable:hover{transform:translateY(-4px);box-shadow:0 5px 12px rgba(0,0,0,.25);}
.card.sel{transform:translateY(-11px) !important;border-color:var(--felt) !important;box-shadow:0 0 0 3px rgba(47,107,70,.5) !important;}
.card.new-c{border-color:var(--gold) !important;animation:glowNew 1.2s ease-in-out infinite alternate;}
@keyframes glowNew{from{box-shadow:0 0 2px 1px rgba(217,164,65,.4);}to{box-shadow:0 0 9px 4px rgba(217,164,65,.7);}}
.card.back{
  background:
    radial-gradient(circle at 50% 50%, #fdf3d6 0 7%, transparent 8%),
    radial-gradient(circle at 50% 50%, #2f5aa8 0 24%, transparent 25%),
    conic-gradient(from 0deg at 50% 50%, #4a72c0 0 30deg,#3a5fa8 0 60deg,#4a72c0 0 90deg,#3a5fa8 0 120deg,#4a72c0 0 150deg,#3a5fa8 0 180deg,#4a72c0 0 210deg,#3a5fa8 0 240deg,#4a72c0 0 270deg,#3a5fa8 0 300deg,#4a72c0 0 330deg,#3a5fa8 0 360deg);
  border-color:#2f5aa8;cursor:default;}
.card.back::after{content:"";position:absolute;inset:8%;border-radius:4px;border:1px solid rgba(253,243,214,.5);}
.card.back:hover{transform:none;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.red{color:var(--red);} .blk{color:var(--blk);} .club{color:var(--club);} .jkr{color:var(--jkr);}
.cr{font-size:0.92rem;line-height:1;}
.cs{font-size:1.3rem;line-height:1;}

/* flying card */
.fly{position:fixed;pointer-events:none;z-index:9999;border-radius:7px;border:1.5px solid #d8d2c6;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:left .65s cubic-bezier(.25,.46,.45,.94),top .65s cubic-bezier(.25,.46,.45,.94),opacity .65s,width .65s,height .65s;}
.card.glow-new{animation:glowAdded .9s ease-in-out infinite alternate !important;border-color:var(--gold) !important;}
@keyframes glowAdded{from{box-shadow:0 0 4px 2px rgba(217,164,65,.4);}to{box-shadow:0 0 14px 6px rgba(217,164,65,.65);}}

/* ── Right column: tabs / coach / log / result ── */
#right-col.panel{background:#fffdf8;border-radius:12px;border:1px solid #e7dfd0;padding:9px;box-shadow:0 3px 10px rgba(138,90,48,.1);}
.tab-btn{font-size:0.66rem;padding:4px 7px;border-radius:6px;border:1px solid #e0d6c2;background:#f3ece0;cursor:pointer;color:#6a5a44;flex:1;font-weight:700;transition:all .15s;}
.tab-btn.active{background:var(--felt);color:#fff;border-color:var(--felt);}
#coach-log,#game-log{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;min-height:0;}
.cm{font-size:0.74rem;padding:5px 8px;border-radius:6px;line-height:1.4;}
.cm-info{background:#f2f0e6;border-left:3px solid var(--oak);color:#4a4232;}
.cm-tip{background:#fff6df;border-left:3px solid var(--gold);color:#6a5320;}
.cm-good{background:#eef7ef;border-left:3px solid var(--felt);color:#284a34;}
.cm-warn{background:#fbeae6;border-left:3px solid var(--danger);color:#7a3126;}
.log-entry{font-size:0.68rem;padding:4px 6px;border-radius:5px;border-left:2px solid var(--oak);color:#4a4232;line-height:1.4;background:#f4efe3;position:relative;}
.log-entry.log-my{border-left-color:var(--felt);background:#eef7ef;}
.log-entry.log-ai{border-left-color:var(--gold);background:#fff6df;}
.log-entry .log-cmt{font-size:0.62rem;color:#8a7c66;font-style:italic;margin-top:2px;}
.log-btn{font-size:0.58rem;padding:1px 5px;border-radius:4px;border:1px solid #d8cdb4;background:#fff;cursor:pointer;color:#6a5a44;}

/* result panel — cream scorebook look */
#result-pane{background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:11px 12px;}
#result-pane .rp-title{font-size:1rem;font-weight:800;color:var(--felt);margin-bottom:2px;}
#result-pane .rp-sub{font-size:0.7rem;color:var(--muted);margin-bottom:9px;}
#result-pane .rp-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:6px 8px;border-bottom:1px solid var(--rule);}
#result-pane .rp-row.rp-winner{background:rgba(47,107,70,.08);border-radius:5px;}
#result-pane .rp-name{font-size:0.78rem;font-weight:700;color:var(--pencil);}
#result-pane .rp-gain{font-size:0.68rem;color:var(--oak-dk);font-weight:700;}
#result-pane .rp-gain.rp-zero{color:var(--felt);}
#result-pane .rp-total{font-size:1.15rem;font-weight:800;color:var(--pencil);min-width:34px;text-align:right;font-family:'Segoe Print','Comic Sans MS',cursive;}
#result-pane .rp-row.rp-danger .rp-total{color:var(--danger);}
#result-pane .rp-row.rp-winner .rp-total{color:var(--felt);position:relative;}
#result-pane .rp-candy{font-size:0.8rem;color:var(--oak-dk);font-weight:700;margin:10px 0;text-align:center;}
#result-pane .rp-btn{margin-top:6px;width:100%;padding:9px 11px;border-radius:8px;border:none;cursor:pointer;font-size:0.84rem;font-weight:800;background:var(--felt);color:#fff;}
#result-pane .rp-btn:hover{background:#25583a;}

/* overlay */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;}
#overlay.on{display:flex;}
#ovbox{background:#fffdf8;border-radius:14px;padding:22px 30px;max-width:460px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,.35);text-align:center;}
#ovbox h2{color:var(--felt);margin-bottom:8px;}
#ovbody{color:#555;line-height:1.65;margin-bottom:14px;white-space:pre-wrap;text-align:left;font-size:0.88rem;}
.ovbtns{display:flex;gap:7px;justify-content:center;}

/* login modal */
#login-overlay{display:none;position:fixed;inset:0;background:rgba(40,25,10,.55);z-index:600;align-items:center;justify-content:center;padding:16px;}
#login-overlay.on{display:flex;}
#login-box{background:#fffdf8;border-radius:16px;padding:24px 26px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;border-top:6px solid var(--oak);}
#lg-logo{font-size:2.3rem;line-height:1;}
#lg-title{color:var(--felt);font-size:1.2rem;margin:5px 0 16px;letter-spacing:1px;}
.lg-sub{color:var(--muted);font-size:0.85rem;margin-bottom:6px;}
.lg-bigname{font-size:1.35rem;font-weight:800;color:var(--pencil);margin-bottom:16px;}
.lg-lbl{display:block;text-align:left;font-size:0.76rem;font-weight:700;color:var(--muted);margin:0 2px 5px;}
.lg-input{width:100%;padding:11px 13px;border:2px solid #e0d6c2;border-radius:10px;font-size:1rem;font-family:inherit;background:#fbf7ec;color:var(--ink);}
.lg-input:focus{outline:none;border-color:var(--felt);}
.lg-pin{letter-spacing:0.55em;text-align:center;font-size:1.35rem;padding-left:0.55em;}
.lg-btn{width:100%;padding:11px;font-size:0.92rem;margin-top:10px;}
.lg-err{color:var(--danger);font-size:0.78rem;min-height:17px;text-align:left;margin:5px 2px 0;}

@media (max-width:900px){
  #right-col{width:190px;}
}
@media (max-width:760px){
  body{overflow:auto;}
  #app{height:auto;min-height:100vh;}
  #main{flex-direction:column;}
  #right-col{width:auto;}
  #seats{flex-wrap:wrap;}
  .opp-panel{min-width:130px;}
}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <h1>🃏 Džiokeris</h1>
    <div id="header-right">
      <span id="candy-lbl">🍬 0</span>
      <span id="wins-lbl">🏆 0</span>
      <span id="skip-btn" onclick="skipAI()">⏩ Praleisti</span>
      <button class="hbtn" id="speed-btn" onclick="toggleSpeed()" title="Žmogaus greitis (iki 10 sek. ėjimas)">🐢 Žmogus</button>
      <button class="hbtn" onclick="confirmNewGame()">↺ Naujas</button>
      <span id="ver-lbl" class="ver-lbl" title="__BUILDHASH__">__BUILD__</span>
    </div>
  </div>

  <div id="main">

    <!-- Center: the felt table -->
    <div id="center-col">
      <div id="felt">

        <div id="round-lbl"></div>

        <!-- draw + discard piles, up in the top-left corner -->
        <div id="piles-row">
          <div class="pile-wrap" id="deck-wrap" onclick="playerDraw('deck')">
            <div class="card back" id="deck-el"></div>
            <div class="pile-label">Malka</div>
            <div class="pile-count" id="deck-ct"></div>
          </div>
          <div class="pile-wrap" id="disc-wrap" onclick="playerDraw('discard')">
            <div id="disc-pile-wrap">
              <div class="card" id="disc-prev" style="position:absolute;top:4px;left:-6px;transform:rotate(-8deg);pointer-events:none;width:51px;height:73px;font-size:0.78rem;z-index:0;display:none"></div>
              <div class="card" id="disc-el" style="position:relative;z-index:1"></div>
            </div>
            <div class="pile-label">Atversta</div>
          </div>
        </div>

        <!-- LEFT seat -->
        <div class="opp-panel side" id="opp0p">
          <div class="opp-hdr"><span class="opp-name" id="opp0n">Rytas</span><span class="opp-ct" id="opp0c"></span></div>
          <div class="opp-hand" id="opp0h"></div>
          <div class="opp-status" id="opp0status"></div><div class="ai-bar-wrap" id="opp0bw"><div class="ai-bar" id="opp0bar"></div></div>
          <div class="opp-combos" id="opp0cb"></div>
        </div>

        <!-- TOP seat -->
        <div class="opp-panel top" id="opp1p">
          <div class="opp-hdr"><span class="opp-name" id="opp1n">Vakaras</span><span class="opp-ct" id="opp1c"></span></div>
          <div class="opp-hand" id="opp1h"></div>
          <div class="opp-status" id="opp1status"></div><div class="ai-bar-wrap" id="opp1bw"><div class="ai-bar" id="opp1bar"></div></div>
          <div class="opp-combos" id="opp1cb"></div>
        </div>

        <!-- RIGHT seat -->
        <div class="opp-panel side" id="opp2p">
          <div class="opp-hdr"><span class="opp-name" id="opp2n">Pietūs</span><span class="opp-ct" id="opp2c"></span></div>
          <div class="opp-hand" id="opp2h"></div>
          <div class="opp-status" id="opp2status"></div><div class="ai-bar-wrap" id="opp2bw"><div class="ai-bar" id="opp2bar"></div></div>
          <div class="opp-combos" id="opp2cb"></div>
        </div>

        <!-- CENTER: the shared table (melds) fills the middle -->
        <div id="center-area">
          <div id="discard-notif"></div>
          <div id="turn-banner" class="round-over">—</div>

          <div id="table-wrap">
            <div id="table-hdr"><span id="table-lbl">Stalas</span></div>
            <div id="combos-row"></div>
          </div>
        </div>

        <!-- YOU (bottom) — hand + integrated controls -->
        <div id="hand-wrap">
          <div id="hand-hdr">
            <span id="hand-lbl">Jūsų rankoje</span>
            <span class="pts-badge" id="hand-pts">0 ak.</span>
            <span id="phase-lbl">—</span>
            <button class="btn bg" id="btn-lay" onclick="doLay()" disabled>▶ Dėti</button>
            <button class="btn bb" id="btn-add" onclick="doAdd()" disabled>+ Pridėti</button>
            <button class="btn br" id="btn-disc" onclick="doDiscard()" disabled>↓ Išmesti</button>
            <button class="btn bw" id="btn-hint" onclick="showHint()">💡</button>
            <button class="btn bw" id="btn-undo" onclick="undoLast()" disabled title="Atšaukti paskutinį ėjimą">↩</button>
          </div>
          <div id="hand-cards"></div>
        </div>

      </div>
    </div>

    <!-- Right: coach + log + round result -->
    <div class="panel" id="right-col">
      <div id="score-bar"></div>
      <div id="result-pane" style="display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;"></div>
      <!-- Treneris (coach) hidden for now; Žurnalas is the only in-play panel. -->
      <div id="tabs-row" style="display:none;gap:5px;margin-bottom:6px;flex-shrink:0;">
        <button class="tab-btn" id="tab-coach" onclick="switchTab('coach')" style="display:none">🧠 Treneris</button>
        <button class="tab-btn active" id="tab-log" onclick="switchTab('log')">📋 Žurnalas</button>
      </div>
      <div id="coach-pane" style="display:none;flex-direction:column;flex:1;min-height:0;overflow-y:auto;">
        <div id="coach-log"></div>
      </div>
      <div id="log-pane" style="display:flex;flex-direction:column;flex:1;min-height:0;">
        <div id="log-hdr" style="font-size:0.62rem;font-weight:700;color:#8a7c66;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;flex-shrink:0;">📋 Žurnalas</div>
        <div id="toasts"></div>
        <div id="game-log" style="display:none"></div>
      </div>
    </div>

  </div>
</div>

<div id="overlay"><div id="ovbox"><h2 id="ovtitle"></h2><div id="ovbody"></div><div class="ovbtns" id="ovbtns"></div></div></div>

<!-- Login: name + 4-digit PIN -->
<div id="login-overlay">
  <div id="login-box">
    <div id="lg-logo">🃏</div>
    <h2 id="lg-title">Džiokeris</h2>

    <!-- returning player on this device -->
    <div id="lg-back" style="display:none">
      <p class="lg-sub">Ar tęsiate kaip</p>
      <div id="lg-back-name" class="lg-bigname"></div>
      <button class="btn bg lg-btn" id="lg-play">▶ Žaisti</button>
      <button class="btn bw lg-btn" id="lg-switch">Kitas žaidėjas</button>
    </div>

    <!-- name + pin form -->
    <div id="lg-form">
      <div id="lg-step-name">
        <label class="lg-lbl" for="lg-name-input">Jūsų vardas</label>
        <input id="lg-name-input" class="lg-input" type="text" maxlength="24" autocomplete="off" placeholder="pvz. Simas">
        <div id="lg-name-err" class="lg-err"></div>
        <button class="btn bg lg-btn" id="lg-next">Toliau →</button>
      </div>
      <div id="lg-step-pin" style="display:none">
        <label class="lg-lbl" id="lg-pin-lbl" for="lg-pin-input"></label>
        <input id="lg-pin-input" class="lg-input lg-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
        <div id="lg-err" class="lg-err"></div>
        <button class="btn bg lg-btn" id="lg-start">▶ Pradėti žaidimą</button>
        <button class="btn bw lg-btn" id="lg-back-btn">← Atgal</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
